name: report2cloud

# The report converter in tools/report2cloud: the conversion of its corpus
# against the snapshots, the command line, and the gates over every generated
# class - abaplint in a scratch copy of this repository with its own v750,
# ABAP Cloud and 7.02 configs, and the abap2UI5 linter - so a change to src/
# that breaks the classes the converter writes fails here too
# (tools/report2cloud/README.md).
#
# The job `runtime` runs the generated classes: transpiled with src/01
# against @abap2ui5/node-runtime, the flight table stubs seeded,
# every report started, filled, executed and clicked through the JSON
# protocol of the UI5 frontend (npm run test:report2cloud:runtime). It uses
# the abap2UI5 MCP server as a library (its npm backend and its app client),
# checked out beside this repository at MCP_SERVER_REF.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report2cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report2cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run test:report2cloud

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # the app client (lib/appclient.mjs, with the selection-dialog pick and
      # the message-popover items of its snapshot), merged in mcp-server#42
      MCP_SERVER_REF: main
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: git clone --depth 1 --branch "$MCP_SERVER_REF" https://github.com/abap2UI5/mcp-server ../mcp-server
    - run: npm run test:report2cloud:runtime

  # the same reports as the real app: the UI5 frontend in headless Chromium
  # (Playwright) against the same transpiled backend, UI5 from the @openui5
  # packages - boot, render, Execute, no page error (npm run
  # test:report2cloud:browser)
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MCP_SERVER_REF: main
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: git clone --depth 1 --branch "$MCP_SERVER_REF" https://github.com/abap2UI5/mcp-server ../mcp-server
    - run: npm run test:report2cloud:browser
