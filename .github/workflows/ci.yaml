name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      v750 as written (abaplint.jsonc) and ABAP Cloud, the
#                 released-API surface (.github/abaplint/abap_cloud.jsonc)
#   check:702     a scratch copy downported and checked (.github/scripts/check-702.sh)
#   check:regex   the regex scan of scripts/check-regex.mjs
#   unit          npm run unit (scripts/unit.mjs) on @abap2ui5/node-runtime, with
#                 the abap2UI5 MCP server as a library (cloned beside the checkout)
#   rename        the namespace rename check (npm run rename)
#   abap2ui5lint  the app classes and their views (abap2ui5lint.jsonc)
#
# The core is pinned to a release tag (abaplint.jsonc, scripts/core-pin.mjs),
# the only dependency of the addon - there is no .github/deps.json. The
# weekly run is the canary against the core's main branch: it catches an
# upstream rename while no pull request is open.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # write only for publish-badges, which runs on main and never for a pull
    # request; every job that runs the code keeps a read-only token
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
    with:
      abaplint: '["./abaplint.jsonc", ".github/abaplint/abap_cloud.jsonc"]'
      npm-scripts: '["check:regex", "check:702"]'
      unit: true
      unit-setup: git clone --depth 1 --branch main https://github.com/abap2UI5/mcp-server ../mcp-server
      rename: true
      canary: ${{ github.event_name == 'schedule' }}
      canary-setup: node scripts/core-pin.mjs set main
