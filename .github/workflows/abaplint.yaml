name: abaplint

# The three release gates. v750 is the source as written (the downport rule
# keeps it downportable), cloud checks it against the released-API surface of
# ABAP Cloud, v702 downports a scratch copy (.github/scripts/check-702.sh) and
# checks that. The core is pinned to a release tag (abaplint.jsonc,
# scripts/core-pin.mjs), the only dependency of the addon. The weekly run is the canary against the core's main
# branch: it catches an upstream rename while no pull request is open.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abaplint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, 'check:regex', 'check:cloud', 'check:702']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # the scheduled run lints against the core's main tip instead of the
    # pinned tag - in this checkout only, it is never committed
    - name: Canary - resolve the core from main
      if: github.event_name == 'schedule'
      run: node scripts/core-pin.mjs set main
    - run: npm run ${{ matrix.check }}
